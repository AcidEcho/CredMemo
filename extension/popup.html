<!doctype html>
<html lang="zh-CN" data-theme="light" data-surface="popup">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f5">
  <meta name="description" content="CredMemo 本地加密凭证库与 2FA 验证器。">
  <title>CredMemo · 凭证管理</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/extension.css">
  <script type="module" src="/src/app.js"></script>
</head>
<body>
  <div id="auth-screen" class="auth-screen" hidden>
    <section class="auth-panel">
      <div class="auth-preferences"><button class="icon-button" data-action="language" data-i18n-aria="language"><svg><use href="/static/icons.svg#globe"/></svg><span class="current-language">中文</span></button><button class="icon-button" data-action="theme" data-i18n-aria="theme"><svg><use href="/static/icons.svg#sun"/></svg></button></div>
      <form id="auth-form" class="auth-form">
        <img class="auth-logo" src="/static/favicon.svg" width="32" height="32" alt="" aria-hidden="true">
        <h2 id="auth-title" data-i18n="welcome">欢迎回来</h2>
        <p id="auth-subtitle" class="muted" data-i18n="unlockDescription">登录，打开你的私人凭证库。</p>
        <label class="field-label" for="auth-password" data-i18n="masterPassword">主密码</label>
        <div class="input-wrap"><svg><use href="/static/icons.svg#lock"/></svg><input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="256" data-i18n-placeholder="passwordPlaceholder" placeholder="输入主密码"><button type="button" class="icon-button" data-action="toggle-password" data-target="auth-password" data-i18n-aria="showPassword"><svg><use href="/static/icons.svg#eye"/></svg></button></div>
        <div id="confirm-field" hidden><label class="field-label" for="confirm-password" data-i18n="confirmPassword">确认主密码</label><div class="input-wrap"><svg><use href="/static/icons.svg#lock"/></svg><input id="confirm-password" type="password" autocomplete="new-password" minlength="6" maxlength="12" data-i18n-placeholder="repeatPassword" placeholder="再次输入主密码"></div><p class="field-hint" data-i18n="masterHint">请妥善保管主密码。忘记后无法解密原凭证库。</p></div>
        <div id="auth-error" class="inline-error" role="alert" hidden></div>
        <button type="submit" class="button primary auth-submit"><span id="auth-submit-label" data-i18n="unlock">解锁凭证库</span><svg><use href="/static/icons.svg#arrow-right"/></svg></button>
        <div class="auth-encryption"><svg><use href="/static/icons.svg#shield"/></svg><span data-i18n="encryptionNote">凭证以 AES-256-GCM 加密存储</span></div>
      </form>
    </section>
  </div>
  <div id="app-screen" class="app-layout" hidden>
    <div class="main-shell">
      <header class="topbar">
        <div class="popup-brand"><img src="/static/favicon.svg" width="22" height="22" alt="" aria-hidden="true"><b>CredMemo</b></div>
        <div class="topbar-actions">
          <div class="heading-actions"><div class="search-control"><button class="button utility-button search-toggle" data-action="search-toggle" data-i18n-aria="searchAction" aria-expanded="false" aria-controls="search-panel"><svg><use href="/static/icons.svg#search"/></svg></button><div id="search-panel" class="search-box" hidden><input id="search" data-i18n-placeholder="search" data-i18n-aria="searchAction" type="search" autocomplete="off"><button class="icon-button" data-action="search-close" data-i18n-aria="closeSearch"><svg><use href="/static/icons.svg#close"/></svg></button></div></div><button class="button primary" data-action="new" data-i18n-aria="addCredential"><svg><use href="/static/icons.svg#plus"/></svg></button><button class="button utility-button" data-action="scan-page" data-i18n-aria="scanSelection"><svg><use href="/static/icons.svg#scan"/></svg></button></div>
          <button class="icon-button" data-action="lock" data-i18n-aria="lockVault"><svg><use href="/static/icons.svg#lock"/></svg></button>
          <button id="toolbar-more" class="icon-button" data-action="toolbar-menu" data-i18n-aria="moreActions" aria-expanded="false" aria-controls="toolbar-menu" aria-haspopup="menu"><svg><use href="/static/icons.svg#more"/></svg></button>
        </div>
        <div id="toolbar-menu" class="toolbar-menu" role="menu" aria-labelledby="toolbar-more" hidden>
          <button class="toolbar-menu-item" role="menuitem" data-action="transfer"><svg><use href="/static/icons.svg#archive"/></svg><span data-i18n="dataCenter">导入与备份</span></button>
          <button class="toolbar-menu-item" role="menuitem" data-action="language"><svg><use href="/static/icons.svg#globe"/></svg><span data-i18n="language">语言</span><span id="toolbar-language" class="toolbar-menu-value"></span></button>
          <button class="toolbar-menu-item" role="menuitem" data-action="theme"><svg><use href="/static/icons.svg#sun"/></svg><span data-i18n="theme">主题</span><span id="toolbar-theme" class="toolbar-menu-value"></span></button>
          <button class="toolbar-menu-item" role="menuitem" data-action="settings" id="header-avatar"><svg><use href="/static/icons.svg#settings"/></svg><span data-i18n="settings">偏好设置</span></button>
        </div>
      </header>
      <main class="main-content">
        <section class="vault-section">
          <div id="entries" class="entries-grid" aria-live="polite"></div><div id="empty-state" class="empty-state" hidden></div>
          <div class="results-line"><span id="results-count"></span><span class="muted" data-i18n="codesRefresh">动态码随时间自动刷新</span></div>
        </section>
      </main>
    </div>
  </div>
  <div id="loading-screen" class="loading-screen"><img class="loading-logo" src="/static/favicon.svg" width="36" height="36" alt="" aria-hidden="true"><span>CredMemo</span><span class="spinner"></span></div>
  <div id="modal-root"></div><div id="drawer-root"></div><div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
</body>
</html>
