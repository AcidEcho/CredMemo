<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CredMemo · 屏幕扫码</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/scanner.css">
  <script type="module" src="/src/scanner.js"></script>
</head>
<body data-state="loading">
  <header>
    <div class="brand"><svg aria-hidden="true"><use href="/static/icons.svg#scan"/></svg><h1 data-i18n="screenScanTitle">屏幕扫码</h1></div>
    <div class="actions"><button id="capture-again" data-i18n="chooseScreen" disabled>选择窗口或屏幕</button><button id="close-scan" class="secondary" data-i18n="close">关闭</button></div>
  </header>
  <main id="preview"><div id="frame"><canvas id="capture" aria-label="屏幕截图，拖动框选二维码" hidden></canvas><div id="selection" hidden></div></div><div id="empty-preview"><svg aria-hidden="true"><use href="/static/icons.svg#scan"/></svg><p data-i18n="screenScanDescription">选择窗口或屏幕后，在截图上框选二维码。</p></div></main>
  <footer><span id="screen-status" role="status" aria-live="polite"></span><span class="local-note" data-i18n="screenLocal">截图仅在本地临时使用</span></footer>
</body>
</html>
