name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Run core tests
        run: npm test
      - name: Build extension package
        run: npm run package
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Version already published. Increase the project and extension versions before uploading."
            exit 1
          fi
          gh release create "$tag" "release/CredMemo-${version}.zip" \
            --target "$GITHUB_SHA" \
            --title "CredMemo ${tag}" \
            --generate-notes
